<title>ЮТУБЕРЫ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Мультяшный минимализм: плоские пастельные формы с толстым тёмным контуром.
   Сверху каналы и настройки; слева комната и три этапа; справа цифры, магазин и лента. Одна игровая тема, цвета заданы явно. */
:root {
  --bg: #e7eff6;
  --card: #ffffff;
  --ink: #1f2338;
  --ink-soft: #5b6180;
  --line: #1f2338;
  --rec: #ff5d4f;
  --mint: #2fbf94;
  --sun: #ffc23d;
  --grape: #7c6cf2;
  --muted: #dfe6ee;
  --display: "Rubik", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--grape); outline-offset: 2px; }
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
  display: grid; gap: 14px;
}
.panel { background: var(--card); border: 3px solid var(--line); border-radius: var(--r); box-shadow: 0 5px 0 var(--line); }

/* Верхняя панель */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font: 800 24px var(--display); letter-spacing: .5px; display: flex; align-items: center; gap: 9px; margin: 0; }
.logo i { display: inline-grid; place-items: center; width: 30px; height: 30px; background: var(--sun); border: 3px solid var(--line); border-radius: 50%; }
.logo i::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--rec); border: 2.5px solid var(--line); }
.chans { display: flex; gap: 8px; flex: 1; min-width: 0; flex-wrap: wrap; }
.chan {
  display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; cursor: pointer;
  border: 2.5px solid var(--line); border-radius: 999px; background: var(--card); box-shadow: 0 3px 0 var(--line);
  font: 700 14px var(--display); min-width: 0;
}
.chan .ti { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; background: var(--bg); flex: none; }
.chan .ti svg { width: 18px; height: 18px; }
.chan small { font: 700 12px var(--body); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.chan[aria-pressed="true"] { background: var(--ink); color: #fff; }
.chan[aria-pressed="true"] small { color: #c9cde0; }
.chan.ghost { border-style: dashed; box-shadow: none; background: transparent; color: var(--ink-soft); padding-left: 12px; }
.chan.ghost.ready { border-style: solid; background: var(--sun); color: var(--ink); box-shadow: 0 3px 0 var(--line); }
.chan:disabled { cursor: default; }
.icons { display: flex; gap: 8px; margin-left: auto; }
.chan > span:not(.ti) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@media (max-width: 700px) {
  .chans { order: 3; flex-basis: 100%; }
  .chan { flex: 1 1 0; }
}
.ibtn {
  width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer;
  border: 2.5px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: 0 3px 0 var(--line);
}
.ibtn svg { width: 22px; height: 22px; }
.ibtn[aria-pressed="false"] { background: var(--muted); }
.ibtn:active, .chan:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }

.main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 880px) { .main { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 14px; min-width: 0; }

/* Комната */
.room { position: relative; overflow: hidden; aspect-ratio: 2 / 1; max-width: 100%; background: #cfe3f2; }
.room canvas { width: 100%; height: 100%; display: block; }
.floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.floater {
  position: absolute; font: 800 14px var(--display); color: var(--ink); white-space: nowrap;
  background: #fff; border: 2.5px solid var(--line); border-radius: 999px; padding: 2px 10px;
  animation: floatUp 1.8s ease-out forwards;
}
.floater.viral { background: var(--sun); }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.8); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -60px); } }
.fx { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.fx span { font: 700 12px var(--display); background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 2px 9px; font-variant-numeric: tabular-nums; }
.fx .bad { background: #ffd3cf; }
.fx .good { background: #fff0c2; }

/* Карточка события */
.event { padding: 14px; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; animation: pop .35s ease-out; }
@keyframes pop { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.event .eico { width: 52px; height: 52px; border-radius: 14px; border: 3px solid var(--line); display: grid; place-items: center; }
.event .eico svg { width: 30px; height: 30px; }
.event h3 { margin: 0; font: 700 18px var(--display); text-wrap: balance; }
.event p { margin: 4px 0 10px; color: var(--ink-soft); }
.event .row { display: flex; gap: 8px; flex-wrap: wrap; }
.ebtn {
  font: 800 15px var(--display); padding: 9px 14px; border: 2.5px solid var(--line); border-radius: 11px; cursor: pointer;
  background: var(--card); box-shadow: 0 3px 0 var(--line);
}
.ebtn.a { background: var(--mint); color: #fff; }
.ebtn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.ebtn:disabled { opacity: .5; cursor: not-allowed; }
.etimer { grid-column: 1 / -1; display: grid; gap: 4px; }
.etimer .bar { height: 8px; }
.etimer small { color: var(--ink-soft); font-size: 12px; font-weight: 700; }

/* Этапы */
.stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 540px) { .stages { grid-template-columns: minmax(0, 1fr); } }
.stage { padding: 12px; display: grid; gap: 8px; }
.stage h3 { margin: 0; font: 700 15px var(--display); display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.stage h3 small { font: 700 12px var(--body); color: var(--ink-soft); white-space: nowrap; }
.bar { height: 14px; background: var(--muted); border: 2.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--c, var(--mint)); transition: width .08s linear; }
.stage[data-stage="rec"] { --c: var(--rec); }
.stage[data-stage="edit"] { --c: var(--grape); }
.stage[data-stage="up"] { --c: var(--mint); }
.act {
  font: 800 16px var(--display); color: #fff; background: var(--c); cursor: pointer;
  border: 3px solid var(--line); border-radius: 12px; padding: 12px 8px; box-shadow: 0 4px 0 var(--line);
  user-select: none; touch-action: manipulation; display: flex; justify-content: center; align-items: center; gap: 6px;
}
.act:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.act:disabled { background: var(--muted); color: var(--ink-soft); cursor: not-allowed; }
.key { font: 700 11px var(--body); border: 2px solid currentColor; border-radius: 5px; padding: 0 4px; opacity: .7; }
.stage .meta { font-size: 12.5px; color: var(--ink-soft); min-height: 1.4em; }

/* Цифры */
.stats { padding: 14px; display: grid; gap: 10px; }
.label { font: 700 12px var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.subs { font: 800 42px/1 var(--display); font-variant-numeric: tabular-nums; }
.goal { display: grid; gap: 4px; }
.goal .bar > div { background: var(--rec); }
.goal small { color: var(--ink-soft); font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; }
.minis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .minis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mini { background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 6px 8px; min-width: 0; }
.mini span { display: block; font-size: 11.5px; color: var(--ink-soft); font-weight: 700; }
.mini b { font: 700 18px var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini.money b { color: #138a68; }

/* Магазин */
.shop { padding: 12px 14px 14px; display: grid; gap: 10px; }
.tabs { display: flex; gap: 6px; }
.tab { flex: 1; font: 700 14px var(--display); padding: 8px 4px; border: 2.5px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: #fff; }
.items { display: grid; gap: 8px; }
.item {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 8px; border: 2.5px solid var(--line); border-radius: 12px; background: var(--card);
}
.ico { width: 44px; height: 44px; border-radius: 10px; border: 2.5px solid var(--line); display: grid; place-items: center; background: var(--bg); }
.ico svg { width: 28px; height: 28px; }
.item .txt { min-width: 0; }
.item .txt b { font: 700 15px var(--display); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.item .txt > span { font-size: 12.5px; color: var(--ink-soft); display: block; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); }
.dots i.on { background: var(--sun); }
.lvl { font: 700 11px var(--body); background: var(--ink); color: #fff; border-radius: 6px; padding: 0 6px; }
.lvl.off { background: var(--muted); color: var(--ink-soft); }
.buy {
  font: 800 14px var(--display); padding: 8px 12px; border: 2.5px solid var(--line); border-radius: 10px; min-width: 72px;
  background: var(--sun); cursor: pointer; box-shadow: 0 3px 0 var(--line); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.buy:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.buy:disabled { background: var(--muted); color: var(--ink-soft); cursor: not-allowed; }
.buy.max { background: var(--mint); color: #fff; opacity: 1; }
.item.locked { opacity: .55; }
.info { display: grid; gap: 10px; }
.info .blk { border: 2.5px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; }
.info h4 { margin: 0; font: 700 15px var(--display); display: flex; gap: 8px; align-items: center; }
.info p { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.info .pm { font-size: 13.5px; }
.info .pm b { font-family: var(--display); }
.awards { display: flex; gap: 6px; flex-wrap: wrap; }
.awards span { font: 700 12px var(--display); border: 2px solid var(--line); border-radius: 8px; padding: 2px 8px; background: var(--muted); color: var(--ink-soft); }
.awards span.on { background: var(--sun); color: var(--ink); }

/* Лента */
.feed { padding: 12px 14px; display: grid; gap: 4px; }
.feed p { margin: 0; font-size: 13.5px; overflow-wrap: anywhere; }
.feed p b { font-family: var(--display); }
.feed p.viral b { background: var(--sun); padding: 0 5px; border-radius: 5px; }
.feed p.ms b { color: var(--grape); }
.feed p.bad { color: #c4453a; }

/* Окна */
.overlay { position: fixed; inset: 0; background: rgba(31, 35, 56, .55); display: grid; place-items: center; z-index: 20; overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { max-width: 420px; width: 100%; padding: 22px; display: grid; gap: 12px; }
.modal h2 { margin: 0; font: 800 26px var(--display); text-wrap: balance; }
.modal p { margin: 0; color: var(--ink-soft); }
.modal .row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  font: 800 15px var(--display); padding: 10px 16px; border: 2.5px solid var(--line); border-radius: 11px; cursor: pointer;
  background: var(--card); box-shadow: 0 3px 0 var(--line);
}
.btn.primary { background: var(--rec); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.menu-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 2px solid var(--muted); font-weight: 700; }
.menu-row:last-of-type { border-bottom: 0; }
.seg { display: flex; border: 2.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { font: 700 13px var(--display); padding: 6px 12px; border: 0; background: var(--card); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.linkbtn { background: none; border: 0; padding: 6px 0; font: 700 14px var(--body); text-decoration: underline; cursor: pointer; text-align: left; }
.linkbtn.danger { color: #c4453a; }

/* Выбор темы */
.picker { max-width: 980px; width: 100%; padding: 22px; display: grid; gap: 14px; }
.picker h2 { margin: 0; font: 800 30px var(--display); }
.picker > p { margin: 0; color: var(--ink-soft); max-width: 60ch; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.tcard {
  text-align: left; padding: 12px; border: 2.5px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer;
  display: grid; gap: 6px; align-content: start;
}
.tcard .ti { width: 44px; height: 44px; border-radius: 12px; border: 2.5px solid var(--line); display: grid; place-items: center; }
.tcard .ti svg { width: 28px; height: 28px; }
.tcard b { font: 700 16px var(--display); }
.tcard span { font-size: 12.5px; color: var(--ink-soft); }
.tcard span em { font-style: normal; font-weight: 800; color: var(--ink); }
.tcard[aria-pressed="true"] { background: #fff0c2; box-shadow: 0 4px 0 var(--line); transform: translateY(-2px); }
.tcard:disabled { opacity: .4; cursor: not-allowed; }
.picker .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* Обучение */
.tip {
  position: fixed; z-index: 15; max-width: min(320px, calc(100vw - 32px)); padding: 12px 14px; display: grid; gap: 8px;
  background: var(--ink); color: #fff; border-radius: 14px; border: 3px solid var(--sun); box-shadow: 0 5px 0 rgba(31,35,56,.35);
  font-weight: 700; animation: pop .3s ease-out;
}
.tip .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.tip button { font: 700 13px var(--display); border-radius: 8px; padding: 5px 10px; cursor: pointer; border: 2px solid var(--sun); background: var(--sun); color: var(--ink); }
.tip button.skip { background: transparent; color: #c9cde0; border-color: transparent; text-decoration: underline; padding: 5px 0; }
.pulse { animation: pulse 1.2s ease-in-out infinite; position: relative; z-index: 1; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,194,61,.9), 0 4px 0 var(--line); } 50% { box-shadow: 0 0 0 8px rgba(255,194,61,0), 0 4px 0 var(--line); } }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: #fff; font: 700 15px var(--display); padding: 10px 18px; border-radius: 999px; z-index: 30;
  border: 3px solid var(--sun); max-width: calc(100% - 32px); text-align: center;
}
@media (prefers-reduced-motion: reduce) { .floater, .event, .tip { animation-duration: .01s; } .pulse { animation: none; outline: 3px solid var(--sun); } .bar > div { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <h1 class="logo"><i aria-hidden="true"></i><span id="logoTxt">ЮТУБЕРЫ</span></h1>
    <nav class="chans" id="chans"></nav>
    <div class="icons">
      <button class="ibtn" id="sfxBtn" type="button" aria-pressed="true"></button>
      <button class="ibtn" id="musicBtn" type="button" aria-pressed="true"></button>
      <button class="ibtn" id="menuBtn" type="button"></button>
    </div>
  </header>

  <div class="main">
    <div class="col">
      <div class="panel room" id="room">
        <canvas id="cv"></canvas>
        <div class="floaters" id="floaters"></div>
        <div class="fx" id="fx"></div>
      </div>
      <div id="eventSlot"></div>
      <div class="stages">
        <div class="panel stage" data-stage="rec">
          <h3><span id="lbl-rec"></span><small id="cnt-rec"></small></h3>
          <div class="bar"><div id="bar-rec"></div></div>
          <button class="act" id="btn-rec" type="button"><span id="txt-rec"></span><span class="key">1</span></button>
          <div class="meta" id="meta-rec"></div>
        </div>
        <div class="panel stage" data-stage="edit">
          <h3><span id="lbl-edit"></span><small id="cnt-edit"></small></h3>
          <div class="bar"><div id="bar-edit"></div></div>
          <button class="act" id="btn-edit" type="button"><span id="txt-edit"></span><span class="key">2</span></button>
          <div class="meta" id="meta-edit"></div>
        </div>
        <div class="panel stage" data-stage="up">
          <h3><span id="lbl-up"></span><small id="cnt-up"></small></h3>
          <div class="bar"><div id="bar-up"></div></div>
          <button class="act" id="btn-up" type="button"><span id="txt-up"></span><span class="key">3</span></button>
          <div class="meta" id="meta-up"></div>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="panel stats" id="stats">
        <div>
          <div class="label" data-t="subs"></div>
          <div class="subs" id="subs">0</div>
        </div>
        <div class="goal">
          <div class="bar"><div id="goalBar"></div></div>
          <small id="goalTxt"></small>
        </div>
        <div class="minis">
          <div class="mini money"><span data-t="money"></span><b id="money">$0</b></div>
          <div class="mini"><span data-t="trust"></span><b id="trust">70%</b></div>
          <div class="mini"><span data-t="quality"></span><b id="quality">×1</b></div>
          <div class="mini"><span data-t="videos"></span><b id="videos">0</b></div>
        </div>
      </div>
      <div class="panel shop">
        <div class="tabs" role="tablist">
          <button class="tab" id="tab-gear" role="tab" type="button" aria-selected="true" data-t="tab_gear"></button>
          <button class="tab" id="tab-team" role="tab" type="button" aria-selected="false" data-t="tab_team"></button>
          <button class="tab" id="tab-channel" role="tab" type="button" aria-selected="false" data-t="tab_channel"></button>
        </div>
        <div class="items" id="items"></div>
      </div>
      <div class="panel feed" id="feed"></div>
    </div>
  </div>
</div>

<div class="overlay" id="pickBox" hidden>
  <div class="panel picker">
    <h2 id="pickH"></h2>
    <p id="pickP"></p>
    <div class="tgrid" id="tgrid"></div>
    <div class="row">
      <button class="btn" id="pickCancel" type="button" data-t="pick_cancel"></button>
      <button class="btn primary" id="pickGo" type="button" data-t="pick_btn" disabled></button>
    </div>
  </div>
</div>

<div class="overlay" id="menuBox" hidden>
  <div class="panel modal">
    <h2 data-t="menu"></h2>
    <div>
      <div class="menu-row"><span data-t="sound"></span><div class="seg"><button type="button" id="mSfxOn" data-t="on"></button><button type="button" id="mSfxOff" data-t="off"></button></div></div>
      <div class="menu-row"><span data-t="music"></span><div class="seg"><button type="button" id="mMusOn" data-t="on"></button><button type="button" id="mMusOff" data-t="off"></button></div></div>
      <div class="menu-row"><span data-t="lang"></span><div class="seg"><button type="button" id="mRu">RU</button><button type="button" id="mEn">EN</button></div></div>
    </div>
    <button class="linkbtn" id="mHowto" type="button" data-t="howto"></button>
    <button class="linkbtn danger" id="mRestart" type="button" data-t="restart"></button>
    <div id="mConfirm" hidden>
      <p><b data-t="reset_q"></b> <span data-t="reset_p"></span></p>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="mNo" type="button" data-t="no"></button>
        <button class="btn primary" id="mYes" type="button" data-t="yes_reset"></button>
      </div>
    </div>
    <div class="row"><button class="btn" id="mClose" type="button" data-t="close"></button></div>
  </div>
</div>

<div class="overlay" id="winBox" hidden>
  <div class="panel modal" style="text-align:center">
    <h2 data-t="win_h"></h2>
    <p id="winTxt"></p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="winGo" type="button" data-t="win_go"></button></div>
  </div>
</div>

<div class="tip" id="tip" hidden>
  <div id="tipTxt"></div>
  <div class="row"><button class="skip" id="tipSkip" type="button" data-t="tut_skip"></button><button id="tipOk" type="button" data-t="tut_ok"></button></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="texts.js"></script>
<script src="logic.js"></script>
<script src="audio.js"></script>
<script>
(function () {
'use strict';
var L = window.Logic, A = window.GameAudio, TX = window.TEXTS;
var SAVE_KEY = 'youtubers_save_v2', SET_KEY = 'youtubers_settings';
var STAGES = ['rec', 'edit', 'up'];
var STAFF_OF = { rec: 'op', edit: 'ed', up: 'mg' };
var $ = function (id) { return document.getElementById(id); };

/* ---------- Настройки и тексты ---------- */
var settings = { lang: 'ru', sfx: true, music: true };
try { var st = JSON.parse(localStorage.getItem(SET_KEY) || '{}'); for (var k in st) settings[k] = st[k]; } catch (e) {}
function saveSettings() { try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch (e) {} }
A.setSfx(settings.sfx); A.setMusic(settings.music);

function t(key, vars) {
  var s = TX[settings.lang][key]; if (s == null) s = key;
  if (vars) for (var v in vars) s = s.split('{' + v + '}').join(vars[v]);
  return s;
}
function th(id) { return TX[settings.lang].themes[id]; }
function dec(x) { return settings.lang === 'ru' ? String(x).replace('.', ',') : String(x); }
function fmt(n) {
  n = Math.floor(n);
  if (n < 1000) return String(n);
  var u = [['B', 1e9], ['M', 1e6], ['K', 1e3]];
  for (var i = 0; i < u.length; i++) if (n >= u[i][1]) {
    var v = n / u[i][1];
    return dec(v >= 100 ? Math.floor(v) : Math.floor(v * 10) / 10) + u[i][0];
  }
}
function fmtMoney(n) { return '$' + fmt(n); }
function fmtFull(n) { return Math.floor(n).toLocaleString(settings.lang === 'ru' ? 'ru-RU' : 'en-US'); }
function fmtClock(sec) { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + ('0' + sec % 60).slice(-2); }
function fmtTime(sec) {
  var m = Math.floor(sec / 60), h = Math.floor(m / 60);
  if (settings.lang === 'ru') return h ? h + ' ч ' + (m % 60) + ' мин' : m + ' мин';
  return h ? h + 'h ' + (m % 60) + 'm' : m + ' min';
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ---------- Иконки ---------- */
var STROKE = 'fill="none" stroke="#1f2338" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"';
var ICON = {
  cam: '<svg viewBox="0 0 28 28" ' + STROKE + '><rect x="3" y="8" width="16" height="13" rx="3" fill="#ff5d4f"/><path d="M19 12l6-3v11l-6-3z" fill="#fff"/></svg>',
  pc: '<svg viewBox="0 0 28 28" ' + STROKE + '><rect x="3" y="4" width="22" height="15" rx="2" fill="#7c6cf2"/><path d="M10 24h8M14 19v5"/></svg>',
  net: '<svg viewBox="0 0 28 28" ' + STROKE + '><path d="M4 11a14 14 0 0 1 20 0M8 15a8.5 8.5 0 0 1 12 0M12 19a3 3 0 0 1 4 0"/><circle cx="14" cy="23" r="1.6" fill="#1f2338"/></svg>',
  mic: '<svg viewBox="0 0 28 28" ' + STROKE + '><rect x="10" y="3" width="8" height="14" rx="4" fill="#ffc23d"/><path d="M6 13a8 8 0 0 0 16 0M14 21v4"/></svg>',
  light: '<svg viewBox="0 0 28 28" ' + STROKE + '><circle cx="14" cy="12" r="8" fill="#fff6d6"/><circle cx="14" cy="12" r="4"/><path d="M14 20v6"/></svg>',
  op: '<svg viewBox="0 0 28 28" ' + STROKE + '><circle cx="14" cy="9" r="5" fill="#ffd9b8"/><path d="M5 25c1-6 5-8 9-8s8 2 9 8z" fill="#ff8a3d"/></svg>',
  ed: '<svg viewBox="0 0 28 28" ' + STROKE + '><circle cx="14" cy="9" r="5" fill="#c99b74"/><path d="M5 25c1-6 5-8 9-8s8 2 9 8z" fill="#7c6cf2"/></svg>',
  mg: '<svg viewBox="0 0 28 28" ' + STROKE + '><circle cx="14" cy="9" r="5" fill="#f1c8a0"/><path d="M5 25c1-6 5-8 9-8s8 2 9 8z" fill="#2fbf94"/></svg>',
  sfxOn: '<svg viewBox="0 0 24 24" ' + STROKE + '><path d="M4 9h4l5-4v14l-5-4H4z" fill="#ffc23d"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  sfxOff: '<svg viewBox="0 0 24 24" ' + STROKE + '><path d="M4 9h4l5-4v14l-5-4H4z" fill="#dfe6ee"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
  musicOn: '<svg viewBox="0 0 24 24" ' + STROKE + '><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.8" fill="#7c6cf2"/><circle cx="17.5" cy="16" r="2.8" fill="#7c6cf2"/></svg>',
  musicOff: '<svg viewBox="0 0 24 24" ' + STROKE + '><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.8" fill="#dfe6ee"/><circle cx="17.5" cy="16" r="2.8" fill="#dfe6ee"/><path d="M3 3l18 18"/></svg>',
  menu: '<svg viewBox="0 0 24 24" ' + STROKE + '><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  // события
  sponsor: '<svg viewBox="0 0 28 28" ' + STROKE + '><circle cx="14" cy="14" r="10" fill="#ffc23d"/><path d="M17 10.5c-1-1-5-1.5-5.5 1s5.5 1.5 5 4.5c-.5 2.5-4.5 2-5.5 1M14 7.5v2M14 18.5v2"/></svg>',
  strike: '<svg viewBox="0 0 28 28" ' + STROKE + '><path d="M14 3l11 20H3z" fill="#ff5d4f"/><path d="M14 11v5M14 19.5v.5" stroke="#fff"/></svg>',
  collab: '<svg viewBox="0 0 28 28" ' + STROKE + '><circle cx="9" cy="10" r="4" fill="#ffd9b8"/><circle cx="19" cy="10" r="4" fill="#c99b74"/><path d="M2 24c1-5 4-7 7-7s6 2 7 7zM12 24c1-5 4-7 7-7s6 2 7 7z" fill="#7c6cf2"/></svg>',
  trend: '<svg viewBox="0 0 28 28" ' + STROKE + '><path d="M3 21l7-7 5 4 9-10" /><path d="M18 8h6v6"/></svg>',
  drama: '<svg viewBox="0 0 28 28" ' + STROKE + '><path d="M4 6h14v10H10l-4 4v-4H4z" fill="#ffd3cf"/><path d="M14 12h10v8h-2v3l-3-3h-5z" fill="#fff"/></svg>',
  broken: '<svg viewBox="0 0 28 28" ' + STROKE + '><rect x="3" y="8" width="17" height="13" rx="3" fill="#c9d2de"/><path d="M20 12l5-3v11l-5-3M9 8l3 6-4 2 3 5"/></svg>',
  fans: '<svg viewBox="0 0 28 28" ' + STROKE + '><path d="M14 24S4 18 4 11a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 7-10 13-10 13z" fill="#ff5d4f"/></svg>'
};
var THEME_ICON = {
  games: '<svg viewBox="0 0 28 28" ' + STROKE + '><rect x="2" y="8" width="24" height="13" rx="6" fill="#7c6cf2"/><path d="M8 12v5M5.5 14.5h5"/><circle cx="19" cy="13" r="1.3" fill="#fff"/><circle cx="21.5" cy="16" r="1.3" fill="#fff"/></svg>',
  cooking: '<svg viewBox="0 0 28 28" ' + STROKE + '><path d="M5 13h18v6a5 5 0 0 1-5 5h-8a5 5 0 0 1-5-5z" fill="#ff8a3d"/><path d="M2 13h24M10 4c-1 2 1 3 0 6M15 4c-1 2 1 3 0 6"/></svg>',
  pranks: '<svg viewBox="0 0 28 28" ' + STROKE + '><circle cx="14" cy="14" r="11" fill="#ffc23d"/><path d="M8 11l3 1.5L8 14M20 11l-3 1.5L20 14"/><path d="M8 17c2 5 10 5 12 0z" fill="#fff"/></svg>',
  tech: '<svg viewBox="0 0 28 28" ' + STROKE + '><rect x="8" y="2" width="12" height="24" rx="3" fill="#8fd3ff"/><path d="M12 22h4"/></svg>',
  truecrime: '<svg viewBox="0 0 28 28" ' + STROKE + '><circle cx="12" cy="12" r="7" fill="#dfe6ee"/><path d="M17 17l7 7"/></svg>',
  vlog: '<svg viewBox="0 0 28 28" ' + STROKE + '><path d="M14 25s-8-7-8-13a8 8 0 0 1 16 0c0 6-8 13-8 13z" fill="#2fbf94"/><circle cx="14" cy="12" r="3" fill="#fff"/></svg>',
  music: '<svg viewBox="0 0 28 28" ' + STROKE + '><path d="M10 21V6l12-3v15"/><circle cx="7" cy="21" r="3.2" fill="#ff5d4f"/><circle cx="19" cy="18" r="3.2" fill="#ff5d4f"/></svg>',
  science: '<svg viewBox="0 0 28 28" ' + STROKE + '><path d="M11 3h6M12 3v8l-7 12a2 2 0 0 0 2 3h14a2 2 0 0 0 2-3l-7-12V3"/><path d="M7.5 19h13l2 4H5.5z" fill="#2fbf94"/></svg>',
  fitness: '<svg viewBox="0 0 28 28" ' + STROKE + '><path d="M9 14h10"/><rect x="3" y="8" width="6" height="12" rx="2" fill="#ff5d4f"/><rect x="19" y="8" width="6" height="12" rx="2" fill="#ff5d4f"/></svg>',
  asmr: '<svg viewBox="0 0 28 28" ' + STROKE + '><path d="M5 17v-3a9 9 0 0 1 18 0v3"/><rect x="3" y="15" width="5" height="9" rx="2" fill="#c9b8f2"/><rect x="20" y="15" width="5" height="9" rx="2" fill="#c9b8f2"/></svg>'
};
var THEME_TINT = { games: '#e4dfff', cooking: '#ffe3cc', pranks: '#fff0c2', tech: '#dff1ff', truecrime: '#e2e5ee', vlog: '#d9f5ea', music: '#ffe0dc', science: '#dcf5ee', fitness: '#ffe0dc', asmr: '#ece4ff' };
var EVENT_TINT = { sponsor: '#fff0c2', strike: '#ffd3cf', collab: '#e4dfff', trend: '#d9f5ea', drama: '#ffe3cc', broken: '#e2e5ee', fans: '#ffe0dc' };

/* ---------- Состояние ---------- */
var S;
function load() {
  var hot = window.claude && window.claude.hot && window.claude.hot.data;
  if (hot && hot.state) return L.restore(hot.state);
  try { var raw = localStorage.getItem(SAVE_KEY); if (raw) return L.restore(JSON.parse(raw)); } catch (e) {}
  return L.newState();
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
S = load();
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return { state: S }; });

var feedLines = [], lastClick = { rec: -9, edit: -9, up: -9 }, now = 0, shopTab = 'gear';

/* ---------- Мелочи интерфейса ---------- */
var toastTimer;
function toast(msg) {
  var el = $('toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 2600);
}
function floater(text, viral) {
  var el = document.createElement('div');
  el.className = 'floater' + (viral ? ' viral' : '');
  el.textContent = text;
  el.style.left = (30 + Math.random() * 40) + '%';
  el.style.top = (20 + Math.random() * 25) + '%';
  $('floaters').appendChild(el);
  setTimeout(function () { el.remove(); }, 1900);
}
function addFeed(html, cls) {
  feedLines.unshift({ html: html, cls: cls || '' });
  if (feedLines.length > 4) feedLines.pop();
  renderFeed();
}
function renderFeed() {
  var box = $('feed');
  box.innerHTML = '<div class="label">' + esc(t('feed')) + '</div>';
  if (!feedLines.length) { var p = document.createElement('p'); p.textContent = t('first'); box.appendChild(p); }
  feedLines.forEach(function (l) { var p = document.createElement('p'); p.className = l.cls; p.innerHTML = l.html; box.appendChild(p); });
}

/* ---------- Тексты на странице ---------- */
function applyTexts() {
  document.documentElement.lang = settings.lang;
  document.title = t('title');
  $('logoTxt').textContent = t('title');
  var els = document.querySelectorAll('[data-t]');
  for (var i = 0; i < els.length; i++) els[i].textContent = t(els[i].getAttribute('data-t'));
  $('sfxBtn').setAttribute('aria-label', t('sound')); $('musicBtn').setAttribute('aria-label', t('music')); $('menuBtn').setAttribute('aria-label', t('menu'));
  $('menuBtn').innerHTML = ICON.menu;
  renderToggles(); renderFeed(); renderChans(); buildShop(); renderEvent(true); renderStageLabels();
}
function renderToggles() {
  $('sfxBtn').innerHTML = settings.sfx ? ICON.sfxOn : ICON.sfxOff; $('sfxBtn').setAttribute('aria-pressed', settings.sfx);
  $('musicBtn').innerHTML = settings.music ? ICON.musicOn : ICON.musicOff; $('musicBtn').setAttribute('aria-pressed', settings.music);
  $('mSfxOn').setAttribute('aria-pressed', settings.sfx); $('mSfxOff').setAttribute('aria-pressed', !settings.sfx);
  $('mMusOn').setAttribute('aria-pressed', settings.music); $('mMusOff').setAttribute('aria-pressed', !settings.music);
  $('mRu').setAttribute('aria-pressed', settings.lang === 'ru'); $('mEn').setAttribute('aria-pressed', settings.lang === 'en');
}
function renderStageLabels() {
  if (!S.channels.length) return;
  var tt = th(L.channel(S).theme);
  STAGES.forEach(function (st) { $('lbl-' + st).textContent = tt[st]; $('txt-' + st).textContent = tt[st + '_btn']; });
}

/* ---------- Каналы ---------- */
function renderChans() {
  var box = $('chans'); box.innerHTML = '';
  S.channels.forEach(function (ch, i) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chan';
    b.setAttribute('aria-pressed', i === S.active);
    b.innerHTML = '<span class="ti" style="background:' + THEME_TINT[ch.theme] + '">' + THEME_ICON[ch.theme] + '</span><span>' + esc(th(ch.theme).name) + '</span><small id="chs-' + i + '"></small>';
    b.addEventListener('click', function () { if (S.active !== i) { S.active = i; A.play('ui'); renderChans(); renderStageLabels(); buildShop(); save(); } });
    box.appendChild(b);
  });
  if (S.channels.length === 1) {
    var g = document.createElement('button'); g.type = 'button'; g.id = 'secondBtn';
    var ready = L.canOpenSecond(S);
    g.className = 'chan ghost' + (ready ? ' ready' : '');
    g.disabled = !ready;
    g.textContent = ready ? t('ch_second_open') : t('ch_second_locked', { n: fmt(L.SECOND_CHANNEL_AT) });
    g.addEventListener('click', function () { openPicker('second'); });
    box.appendChild(g);
  }
  updateChanSubs();
}
function updateChanSubs() {
  S.channels.forEach(function (ch, i) { var el = $('chs-' + i); if (el) el.textContent = fmt(ch.subs); });
  var g = $('secondBtn');
  if (g && g.disabled && L.canOpenSecond(S)) renderChans();
}

/* ---------- Выбор темы ---------- */
var pickMode = 'first', picked = null;
function openPicker(mode) {
  pickMode = mode; picked = null;
  $('pickH').textContent = t(mode === 'first' ? 'pick_h' : 'pick_second_h');
  $('pickP').textContent = mode === 'first' ? t('pick_p', { n: fmt(L.SECOND_CHANNEL_AT) }) : t('pick_second_p');
  $('pickCancel').hidden = mode === 'first';
  $('pickGo').disabled = true;
  var grid = $('tgrid'); grid.innerHTML = '';
  L.THEME_IDS.forEach(function (id) {
    var tt = th(id), b = document.createElement('button');
    b.type = 'button'; b.className = 'tcard'; b.setAttribute('aria-pressed', 'false');
    b.disabled = mode === 'second' && S.channels[0] && S.channels[0].theme === id;
    b.innerHTML = '<span class="ti" style="background:' + THEME_TINT[id] + '">' + THEME_ICON[id] + '</span><b>' + esc(tt.name) + '</b>' +
      '<span><em>+</em> ' + esc(tt.plus) + '</span><span><em>−</em> ' + esc(tt.minus) + '</span>';
    b.addEventListener('click', function () {
      picked = id; A.unlock(); A.play('ui');
      grid.querySelectorAll('.tcard').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
      $('pickGo').disabled = false;
    });
    grid.appendChild(b);
  });
  $('pickBox').hidden = false;
}
$('pickGo').addEventListener('click', function () {
  if (!picked) return;
  if (L.startChannel(S, picked)) {
    $('pickBox').hidden = true;
    if (S.tut === 0) S.tut = 1;
    A.play('good'); save();
    renderChans(); renderStageLabels(); buildShop(); renderAll();
  }
});
$('pickCancel').addEventListener('click', function () { $('pickBox').hidden = true; });

/* ---------- События логики ---------- */
function pickTitle() { var list = th(L.channel(S).theme).titles; return list[Math.floor(Math.random() * list.length)]; }
function handle(events) {
  events.forEach(function (e) {
    if (e.type === 'published') {
      var key = e.viral ? 'viral' : e.boost === 'collab' ? 'boosted_collab' : e.boost === 'trend' ? 'boosted_trend' : 'published';
      addFeed(t(key, { title: esc(pickTitle()), v: '<b>' + fmt(e.views) + '</b>', s: fmt(e.subs) }), e.viral ? 'viral' : '');
      floater('+' + fmt(e.views) + ' ' + t('unit_views'), e.viral);
      A.play(e.viral ? 'viral' : 'publish');
    } else if (e.type === 'recorded' || e.type === 'edited') {
      A.play('step');
    } else if (e.type === 'milestone') {
      addFeed('<b>' + esc(t('ms', { n: fmtFull(e.value) })) + '</b>', 'ms');
      toast(t('ms', { n: fmtFull(e.value) })); A.play('milestone');
    } else if (e.type === 'second_ready') {
      toast(t('second_ready')); addFeed('<b>' + esc(t('second_ready')) + '</b>', 'ms'); renderChans(); A.play('good');
    } else if (e.type === 'event') {
      renderEvent(true); A.play('card');
    } else if (e.type === 'event_timeout') {
      showResult(e.result, true); renderEvent(true);
    } else if (e.type === 'effect_end') {
      if (e.effect === 'strike' || e.effect === 'broken') addFeed(esc(t('effect_end_' + e.effect)));
    } else if (e.type === 'won') {
      $('winTxt').textContent = t('win_txt', { t: fmtTime(S.wonAt), v: fmtFull(L.totalVideos(S)) });
      $('winBox').hidden = false; A.play('milestone'); save();
    }
  });
}

/* ---------- Карточки событий ---------- */
var shownEvent = null;
function evVars(ev) {
  var tt = th(ev.theme), L2 = TX[settings.lang];
  return {
    brand: tt.brands[ev.amount % tt.brands.length], m: fmtMoney(ev.amount || 0), t: ev.trust,
    reason: tt.strike, name: ev.name, n: fmt(ev.partner || 0), mult: dec(Math.round((ev.mult || 0) * 10) / 10),
    c: fmtMoney(ev.cost || 0), trend: L2.trends[Math.floor(ev.expires) % L2.trends.length]
  };
}
function renderEvent(force) {
  var slot = $('eventSlot'), ev = S.event;
  if (!ev) { if (shownEvent) { slot.innerHTML = ''; shownEvent = null; } return; }
  if (ev !== shownEvent || force) {
    shownEvent = ev;
    var v = evVars(ev), k = ev.kind;
    var aKey = k === 'collab' ? (ev.cost ? 'ev_collab_a_paid' : 'ev_collab_a_free') : 'ev_' + k + '_a';
    var vv = { brand: v.brand, m: v.m, t: v.t, reason: v.reason, name: v.name, n: v.n, c: v.c, trend: v.trend };
    vv.m = k === 'collab' ? v.mult : v.m;
    slot.innerHTML =
      '<div class="panel event" id="eventCard"><div class="eico" style="background:' + EVENT_TINT[k] + '">' + ICON[k] + '</div>' +
      '<div><h3>' + esc(t('ev_' + k + '_h', vv)) + '</h3><p>' + esc(t('ev_' + k + '_p', vv)) + '</p>' +
      '<div class="row"><button class="ebtn a" type="button" id="evA">' + esc(t(aKey, vv)) + '</button>' +
      '<button class="ebtn" type="button" id="evB">' + esc(t('ev_' + k + '_b', vv)) + '</button></div></div>' +
      '<div class="etimer"><div class="bar"><div id="evBar" style="background:var(--sun)"></div></div><small id="evTime"></small></div></div>';
    $('evA').addEventListener('click', function () { answer('a'); });
    $('evB').addEventListener('click', function () { answer('b'); });
  }
  var left = ev.expires - S.played;
  $('evBar').style.width = Math.max(0, left / 30 * 100) + '%';
  $('evTime').textContent = t('ev_timer', { n: Math.max(0, Math.ceil(left)) });
  var a = $('evA');
  if (a) a.disabled = (ev.kind === 'collab' || ev.kind === 'broken') && S.money < (ev.cost || 0);
}
function answer(choice) {
  if (!S.event) return;
  var res = L.resolveEvent(S, choice, Math.random);
  showResult(res, false);
  renderEvent(true); buildShop(); renderAll(); save();
}
function resultText(r) {
  var k = r.kind, c = r.choice;
  if (k === 'sponsor') return c === 'a' ? t('r_sponsor_a', { m: fmtMoney(r.money) }) : t('r_sponsor_b');
  if (k === 'strike') return c === 'a' ? t(r.ok ? 'r_strike_ok' : 'r_strike_fail') : t('r_strike_b');
  if (k === 'collab') return c === 'a' ? t(r.ok ? 'r_collab_a' : 'r_collab_nomoney') : t('r_collab_b');
  if (k === 'trend') return t(c === 'a' ? 'r_trend_a' : 'r_trend_b');
  if (k === 'drama') return c === 'a' ? (r.ok ? t('r_drama_ok', { s: fmt(r.subs) }) : t('r_drama_fail')) : t('r_drama_b');
  if (k === 'broken') return c === 'a' ? t(r.ok ? 'r_broken_a' : 'r_broken_nomoney') : t('r_broken_b');
  if (k === 'fans') return c === 'a' ? t('r_fans_a', { s: fmt(r.subs) }) : t('r_fans_b');
  return '';
}
function showResult(r, timeout) {
  if (!r) return;
  var txt = resultText(r);
  if (timeout) txt = t('r_timeout', { r: txt });
  var bad = (r.kind === 'strike' && r.choice === 'a' && !r.ok) || (r.kind === 'drama' && r.choice === 'a' && !r.ok) || (r.kind === 'broken' && (r.choice === 'b' || !r.ok));
  addFeed(esc(txt), bad ? 'bad' : '');
  toast(txt);
  A.play(bad ? 'bad' : (r.choice === 'a' ? 'good' : 'ui'));
}

/* ---------- Действия ---------- */
function work(stage) {
  if (!L.canWork(S, stage)) return;
  lastClick[stage] = now;
  A.play(stage);

var tipTarget = null;
function cheapestGearRow() {
  var best = null, bestCost = Infinity;
  L.GEAR_IDS.forEach(function (k) { var c = L.gearCost(S, k); if (c != null && c < bestCost) { bestCost = c; best = k; } });
  return { kind: best, cost: bestCost };
}
function tutStep() {
  var tt = S.channels.length ? th(L.channel(S).theme) : null;
  var videos = L.totalVideos(S), gearSum = 0, staffSum = S.staff.op + S.staff.ed + S.staff.mg;
  L.GEAR_IDS.forEach(function (k) { gearSum += S.gear[k]; });
  switch (S.tut) {
    case 1: return { done: S.raw > 0 || S.edited > 0 || videos > 0, el: $('btn-rec'), text: t('tut_1', { btn: tt.rec_btn }) };
    case 2: return { done: S.edited > 0 || videos > 0, el: $('btn-edit'), text: t('tut_2', { btn: tt.edit_btn }) };
    case 3: return { done: videos > 0, el: $('btn-up'), text: t('tut_3') };
    case 4: return { done: false, el: $('stats'), text: t('tut_4'), ok: true };
    case 5: {
      var cg = cheapestGearRow();
      if (gearSum > 0) return { done: true };
      if (S.money < cg.cost) return { wait: true };
      if (shopTab !== 'gear') setTab('gear');
      return { done: false, el: $('buy-' + cg.kind), text: t('tut_5') };
    }
    case 6: {
      if (staffSum > 0) return { done: true };
      if (S.money < 120) return { wait: true };
      return { done: false, el: shopTab === 'team' ? $('buy-mg') : $('tab-team'), text: t('tut_6') };
    }
    case 7: {
      if (!S.event) return { wait: true };
      return { done: false, el: $('eventCard'), text: t('tut_7'), ok: true };
    }
    default: return null;
  }
}

      [[x + 4, y + 6, 40, 32, '#9fd8ff'], [x + 52, y + 2, 32, 40, '#ffc23d'], [x + 92, y + 10, 30, 28, '#2fbf94'], [x + 24, y + 48, 44, 30, '#ff8a3d'], [x + 78, y + 48, 36, 30, '#c9b8f2']].forEach(function (f) {
        rr(f[0], f[1], f[2], f[3], 3); shape('#fff', 2.5); rr(f[0] + 4, f[1] + 4, f[2] - 8, f[3] - 8, 2); shape(f[4], 2);
      });
      break;
    case 'music':
      for (var i = 0; i < 3; i++) for (var j = 0; j < 2; j++) { rr(x + 4 + i * 26, y + 4 + j * 26, 22, 22, 3); shape(i % 2 === j % 2 ? '#5b6180' : '#7a809c', 2); }
      ctx.save(); ctx.translate(x + 104, y + 44); ctx.rotate(0.25);
      rr(-3, -42, 6, 44, 2); shape('#6b4a2d', 2.5); ctx.beginPath(); ctx.ellipse(0, 12, 14, 18, 0, 0, Math.PI * 2); shape('#ff8a3d'); circ(0, 8, 5); shape('#2c3150', 2);

    case 'science':

      for (var a = 0; a < 4; a++) for (var b = 0; b < 4; b++) { ctx.fillStyle = ['#ffd3cf', '#d9f5ea', '#dff1ff', '#fff0c2'][(a + b) % 4]; ctx.fillRect(x + 10 + a * 14, y + 8 + b * 13, 11, 10); }

      ctx.beginPath(); ctx.moveTo(x + 86, y + 24); ctx.lineTo(x + 86, y + 34); ctx.lineTo(x + 78, y + 50); ctx.lineTo(x + 102, y + 50); ctx.lineTo(x + 94, y + 34); ctx.lineTo(x + 94, y + 24); ctx.closePath(); shape('#7be0a8', 2.5);
      rr(x + 106, y + 28, 10, 22, 4); shape('#ff8a3d', 2.5);

      [x + 14, x + 52, x + 90].forEach(function (dx, i) { line([dx, y + 52, dx + 22, y + 52], 3); rr(dx - 6, y + 42 - i * 2, 8, 20 + i * 4, 2); shape('#ff5d4f', 2); rr(dx + 20, y + 42 - i * 2, 8, 20 + i * 4, 2); shape('#ff5d4f', 2); });
      circ(x + 60, y + 18, 15); shape('#fff'); line([x + 60, y + 18, x + 60, y + 9], 2.5); line([x + 60, y + 18, x + 67, y + 21], 2.5);
      break;
    case 'asmr':

      [[x + 20, '#2fbf94'], [x + 60, '#7be0a8'], [x + 100, '#2fbf94']].forEach(function (p, i) {
        rr(p[0] - 10, y + 28, 20, 16, 4); shape('#e9c79f', 2.5);
        ctx.beginPath(); ctx.ellipse(p[0] - 6, y + 18 - i * 2, 6, 11, -0.4, 0, Math.PI * 2); shape(p[1], 2.5);
        ctx.beginPath(); ctx.ellipse(p[0] + 6, y + 18 - i * 2, 6, 11, 0.4, 0, Math.PI * 2); shape(p[1], 2.5);
      });

}

// Награды: зона x 330–616, y 26–84
function drawAwards() {
  var colors = ['#e5a46b', '#c9d2de', '#ffc23d', '#8fd3ff', '#ff5d4f'];
  for (var i = 0; i < S.milestones.length && i < 5; i++) {
    var v = L.MILESTONES[i], x = 340 + i * 56, y = 26;
    rr(x, y, 44, 56, 6); shape(colors[i]);
    rr(x + 8, y + 8, 28, 22, 6); shape('#fff', 2.5);
    ctx.beginPath();
    for (var k = 0; k < 10; k++) { var a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? 4 : 9; ctx.lineTo(x + 22 + Math.cos(a) * rad, y + 19 + Math.sin(a) * rad); }
    ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
    ctx.font = '700 11px Rubik, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(v >= 1e6 ? '1M' : v >= 1000 ? (v / 1000) + 'K' : v, x + 22, y + 47);

}

// Камера на штативе: x 110
function drawCamera(tier) {
  var x = 112, y = 162;
  line([x, y, x - 22, FLOOR]); line([x, y, x + 22, FLOOR]); line([x, y, x, FLOOR]);
  if (tier === 0) { rr(x - 12, y - 34, 24, 40, 5); shape('#2c3150'); rr(x - 8, y - 29, 16, 28, 3); shape('#8fd3ff', 2); }
  else if (tier === 1) { rr(x - 22, y - 8, 44, 8, 3); shape('#5b6180', 2.5); circ(x, y - 22, 16); shape('#f4f6fb'); circ(x, y - 22, 7); shape('#2c3150'); }
  else if (tier === 2) { rr(x - 26, y - 32, 42, 30, 6); shape('#2c3150'); rr(x - 16, y - 40, 16, 9, 3); shape('#2c3150'); circ(x + 18, y - 17, 11); shape('#4a5178'); circ(x + 18, y - 17, 5); shape('#8fd3ff', 2); }
  else {
    var big = tier === 4 ? 1.15 : 1;
    ctx.save(); ctx.translate(x, y); ctx.scale(big, big);
    rr(-30, -36, 50, 32, 6); shape('#2c3150'); rr(20, -30, 18, 20, 4); shape('#4a5178');
    circ(-18, -46, 11); shape('#4a5178'); circ(4, -46, 11); shape('#4a5178');
    rr(-26, -10, 12, 5, 2); shape(tier === 4 ? '#ffc23d' : '#ff5d4f', 2);
    ctx.restore();
  }
}

// Микрофон: x 262
function drawMic(tier) {
  if (tier < 2) return; // петличка рисуется на герое
  var x = 272;
  line([x - 12, FLOOR, x + 12, FLOOR], 3); line([x, FLOOR, x, 186]);
  if (tier === 2) { rr(x - 7, 160, 14, 26, 7); shape('#c9d2de'); }
  else if (tier === 3) { circ(x, 180, 11); ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke(); rr(x - 8, 152, 16, 32, 8); shape('#ffc23d'); }
  else { rr(x - 9, 150, 18, 36, 9); shape('#2c3150'); line([x - 9, 160, x + 9, 160], 2); line([x - 9, 170, x + 9, 170], 2); }
}

// Свет: x 322
function drawLight(tier) {
  if (tier === 0) return;
  var x = 324;
  var glow = ctx.createRadialGradient(230, 180, 10, 230, 180, 140 + tier * 20);
  glow.addColorStop(0, 'rgba(255,246,214,' + (0.15 + tier * 0.07) + ')'); glow.addColorStop(1, 'rgba(255,246,214,0)');
  ctx.fillStyle = glow; ctx.fillRect(100, 40, 280, FLOOR - 40);
  if (tier === 1) { line([x, FLOOR, x, 196]); line([x - 12, FLOOR, x + 12, FLOOR]); ctx.beginPath(); ctx.moveTo(x - 16, 196); ctx.lineTo(x + 16, 196); ctx.lineTo(x + 8, 176); ctx.lineTo(x - 8, 176); ctx.closePath(); shape('#ffc23d'); }
  else if (tier === 2) {
    line([x, FLOOR, x, 150]); line([x - 14, FLOOR, x + 14, FLOOR]);
    circ(x, 128, 22); ctx.lineWidth = 10; ctx.strokeStyle = '#fffbe8'; ctx.stroke();
    ctx.lineWidth = 3; ctx.strokeStyle = INK; circ(x, 128, 27); ctx.stroke(); circ(x, 128, 17); ctx.stroke();
  } else {
    var w = tier === 4 ? 56 : 46, h = tier === 4 ? 46 : 40;

  }
}

// Стол и компьютер: x 424–584
function drawDesk(tier) {
  rr(424, 184, 160, 14, 4); shape('#e9c79f');

function drawRoom() {
  if (!S.channels.length) { ctx.fillStyle = '#cfe3f2'; ctx.fillRect(0, 0, W, H); return; }
  var theme = L.channel(S).theme, R = ROOM[theme];
  ctx.fillStyle = R.wall; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = R.floor; ctx.fillRect(0, FLOOR, W, H - FLOOR);
  line([0, FLOOR, W, FLOOR]);
  if (theme === 'cooking') { ctx.fillStyle = 'rgba(255,255,255,.18)'; for (var fx = 0; fx < W; fx += 40) for (var fy = FLOOR; fy < H; fy += 34) if (((fx / 40) + Math.floor((fy - FLOOR) / 34)) % 2 === 0) ctx.fillRect(fx, fy, 40, 34); }
  drawWindow(R.night);
  drawDecor(theme);
  drawAwards();
  drawLight(S.gear.light);
  drawDesk(S.gear.pc);
  drawRouter(S.gear.net);

  var recording = now - lastClick.rec < 0.5 || S.staff.op > 0;
  person(214, 202, {
    skin: '#ffd9b8', shirt: '#ff5d4f', hair: '#3b2a22', hat: theme, lav: S.gear.mic === 1,

    arm: recording ? Math.sin(now * 9) * 0.3 + 0.15 : 0, talk: recording, blink: (now % 4) < 0.12
  });
  drawMic(S.gear.mic);
  drawCamera(S.gear.cam);
  if (recording) {
    rr(10, 6, 62, 22, 11); shape('#fff', 2.5);
    circ(24, 17, 5.5); ctx.fillStyle = Math.sin(now * 8) > 0 ? '#ff5d4f' : '#ffb3ab'; ctx.fill();
    ctx.fillStyle = INK; ctx.font = '700 12px Rubik, sans-serif'; ctx.textAlign = 'left'; ctx.fillText('REC', 34, 21.5);
  }
  // команда: у каждого своё место
  if (S.staff.op > 0) person(44, 214, { skin: '#ffd9b8', shirt: '#ff8a3d', hair: '#1f2338', scale: 0.68, bob: Math.sin(now * 3 + 1) * 1.2 });
  if (S.staff.mg > 0) person(382, 220, { skin: '#f1c8a0', shirt: '#2fbf94', hair: '#8a4b2d', scale: 0.62, bob: Math.sin(now * 3 + 3) * 1.2, talk: Math.sin(now * 0.7) > 0.4 });
  if (S.staff.ed > 0) person(612, 220, { skin: '#c99b74', shirt: '#7c6cf2', hair: '#1f2338', scale: 0.62, bob: Math.sin(now * 3 + 2) * 1.2, arm: Math.sin(now * 12) * 0.1 });
}

/* ---------- Главный цикл ---------- */
var last = performance.now(), uiTimer = 0, saveTimer = 0;
function frame(ts) {
  var dt = Math.min(0.25, (ts - last) / 1000); last = ts; now += dt;
  handle(L.tick(S, dt, Math.random));
  uiTimer += dt; saveTimer += dt;
  if (uiTimer > 0.15) { uiTimer = 0; renderAll(); }
  if (saveTimer > 5) { saveTimer = 0; save(); }
  drawRoom();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
window.addEventListener('beforeunload', save);

function start() {
  resize(); applyTexts(); renderAll();
  if (!S.channels.length) openPicker('first');
  requestAnimationFrame(function (ts) { last = ts; frame(ts); });
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
})();
