<title>ЮТУБЕРЫ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Мультяшный минимализм: плоские пастельные формы с толстым тёмным контуром.
   Сверху каналы, часы и настройки; слева квартира, работа и три этапа; справа цифры, вкладки и новости.
   Одна игровая тема, цвета заданы явно. */
:root {
  --bg: #e7eff6;
  --card: #ffffff;
  --ink: #1f2338;
  --ink-soft: #5b6180;
  --line: #1f2338;
  --rec: #ff5d4f;
  --mint: #2fbf94;
  --sun: #ffc23d;
  --grape: #7c6cf2;
  --muted: #dfe6ee;
  --display: "Rubik", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --r: 16px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--grape); outline-offset: 2px; }
.wrap {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px; display: grid; gap: 14px;
}
.panel { background: var(--card); border: 3px solid var(--line); border-radius: var(--r); box-shadow: 0 5px 0 var(--line); }
.label { font: 700 12px var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.bar { height: 14px; background: var(--muted); border: 2.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--c, var(--mint)); transition: width .1s linear; }

/* Верхняя панель */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.logo { font: 800 24px var(--display); letter-spacing: .5px; display: flex; align-items: center; gap: 9px; margin: 0; }
.logo i { display: inline-grid; place-items: center; width: 30px; height: 30px; background: var(--sun); border: 3px solid var(--line); border-radius: 50%; }
.logo i::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--rec); border: 2.5px solid var(--line); }
.chans { display: flex; gap: 8px; flex: 1; min-width: 0; flex-wrap: wrap; }
.chan {
  display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; cursor: pointer; min-width: 0;
  border: 2.5px solid var(--line); border-radius: 999px; background: var(--card); box-shadow: 0 3px 0 var(--line); font: 700 14px var(--display);
}
.chan .ti { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.chan .ti svg { width: 18px; height: 18px; }
.chan > span:not(.ti) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chan small { font: 700 12px var(--body); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.chan[aria-pressed="true"] { background: var(--ink); color: #fff; }
.chan[aria-pressed="true"] small { color: #c9cde0; }
.chan.ghost { border-style: dashed; box-shadow: none; background: transparent; color: var(--ink-soft); padding-left: 12px; }
.chan.ghost.ready { border-style: solid; background: var(--sun); color: var(--ink); box-shadow: 0 3px 0 var(--line); }
.chan:disabled { cursor: default; }
.right-top { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.clock { display: flex; align-items: center; gap: 6px; font: 700 14px var(--display); padding: 7px 12px; border: 2.5px solid var(--line); border-radius: 999px; background: var(--card); font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock svg { width: 18px; height: 18px; }
.ibtn { width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; border: 2.5px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: 0 3px 0 var(--line); }
.ibtn svg { width: 22px; height: 22px; }
.ibtn[aria-pressed="false"] { background: var(--muted); }
.ibtn:active, .chan:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
@media (max-width: 760px) { .chans { order: 3; flex-basis: 100%; } .chan { flex: 1 1 0; } }
@media (max-width: 420px) { .clock span { display: none; } .logo { font-size: 20px; } }

.main { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 14px; min-width: 0; }

/* Квартира */
.room { position: relative; overflow: hidden; aspect-ratio: 64 / 41; max-width: 100%; background: #eef3f8; }
.room canvas { width: 100%; height: 100%; display: block; }
.floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.floater { position: absolute; font: 800 14px var(--display); white-space: nowrap; background: #fff; border: 2.5px solid var(--line); border-radius: 999px; padding: 2px 10px; animation: floatUp 1.8s ease-out forwards; }
.floater.viral { background: var(--sun); }
.floater.nomoney { background: var(--muted); }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.8); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -60px); } }
.fx { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.fx span { font: 700 12px var(--display); background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 2px 9px; font-variant-numeric: tabular-nums; }
.fx .bad { background: #ffd3cf; }
.fx .good { background: #fff0c2; }

/* Работа */
.job { padding: 12px 14px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.job .ico { background: #fff0c2; }
.job b { font: 700 15px var(--display); display: block; }
.job p { margin: 0; font-size: 13px; color: var(--ink-soft); }
.job .bar { margin-top: 6px; --c: var(--sun); }
.jbtn { font: 800 15px var(--display); padding: 10px 14px; border: 2.5px solid var(--line); border-radius: 12px; background: var(--sun); cursor: pointer; box-shadow: 0 3px 0 var(--line); white-space: nowrap; }
.jbtn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.jbtn:disabled { background: var(--muted); color: var(--ink-soft); cursor: not-allowed; }
.job.quiet { grid-template-columns: minmax(0, 1fr) auto; padding: 8px 14px; }
.job.quiet .ico, .job.quiet p.why { display: none; }
@media (max-width: 480px) { .job { grid-template-columns: 44px minmax(0, 1fr); } .job .jbtn { grid-column: 1 / -1; } .job.quiet { grid-template-columns: minmax(0, 1fr); } .job.quiet .jbtn { grid-column: auto; } }

/* Формат видео */
.fmt { padding: 10px 12px; display: grid; gap: 8px; }
.fmt-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.fbtn { font: 700 14px var(--display); padding: 8px 6px; border: 2.5px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; }
.fbtn[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: 0 3px 0 var(--sun); }
.fmt small { font-size: 12.5px; color: var(--ink-soft); }
.jbtn.ghost { background: var(--card); }

/* Этапы */
.stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 540px) { .stages { grid-template-columns: minmax(0, 1fr); } }
.stage { padding: 12px; display: grid; gap: 8px; }
.stage h3 { margin: 0; font: 700 15px var(--display); display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.stage h3 small { font: 700 12px var(--body); color: var(--ink-soft); white-space: nowrap; }
.stage[data-stage="rec"] { --c: var(--rec); }
.stage[data-stage="edit"] { --c: var(--grape); }
.stage[data-stage="up"] { --c: var(--mint); }
.act { font: 800 16px var(--display); color: #fff; background: var(--c); cursor: pointer; border: 3px solid var(--line); border-radius: 12px; padding: 12px 8px; box-shadow: 0 4px 0 var(--line); user-select: none; touch-action: manipulation; display: flex; justify-content: center; align-items: center; gap: 6px; }
.act:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.act:disabled { background: var(--muted); color: var(--ink-soft); cursor: not-allowed; }
.key { font: 700 11px var(--body); border: 2px solid currentColor; border-radius: 5px; padding: 0 4px; opacity: .7; }
.stage .meta { font-size: 12.5px; color: var(--ink-soft); min-height: 1.4em; }

/* Цифры */
.stats { padding: 14px; display: grid; gap: 10px; }
.subs-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.subs { font: 800 42px/1 var(--display); font-variant-numeric: tabular-nums; }
.monchip { font: 700 12px var(--display); border: 2px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--muted); color: var(--ink-soft); white-space: nowrap; }
.monchip.on { background: #d9f5ea; color: #0f6d52; }
.goal { display: grid; gap: 4px; }
.goal .bar { --c: var(--rec); }
.goal small { color: var(--ink-soft); font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; }
.minis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .minis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mini { background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 6px 8px; min-width: 0; }
.mini span { display: block; font-size: 11.5px; color: var(--ink-soft); font-weight: 700; }
.mini b { font: 700 18px var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini.money b { color: #138a68; }

/* Вкладки */
.shop { padding: 12px 14px 14px; display: grid; gap: 10px; }
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.tab { position: relative; font: 700 13px var(--display); padding: 8px 2px; border: 2.5px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab[aria-selected="true"] { background: var(--ink); color: #fff; }
.tab .badge { position: absolute; top: 2px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--rec); color: #fff; font: 700 10px/16px var(--body); }
@media (max-width: 420px) { .tab { font-size: 11.5px; } }
.items { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border: 2.5px solid var(--line); border-radius: 12px; background: var(--card); }
.ico { width: 44px; height: 44px; border-radius: 10px; border: 2.5px solid var(--line); display: grid; place-items: center; background: var(--bg); flex: none; }
.ico svg { width: 28px; height: 28px; }
.item .txt { min-width: 0; }
.item .txt b { font: 700 15px var(--display); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.item .txt > span { font-size: 12.5px; color: var(--ink-soft); display: block; }
.item .txt > span.warn { color: #b4532a; font-weight: 700; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); }
.dots i.on { background: var(--sun); }
.lvl { font: 700 11px var(--body); background: var(--ink); color: #fff; border-radius: 6px; padding: 0 6px; }
.lvl.off { background: var(--muted); color: var(--ink-soft); }
.lvl.now { background: var(--mint); }
.buy { font: 800 14px var(--display); padding: 8px 12px; border: 2.5px solid var(--line); border-radius: 10px; min-width: 74px; background: var(--sun); cursor: pointer; box-shadow: 0 3px 0 var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.buy:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.buy:disabled { background: var(--muted); color: var(--ink-soft); cursor: not-allowed; }
.buy.max { background: var(--mint); color: #fff; }
.item.locked { opacity: .55; }
.item.current { background: #f1fbf7; }

/* Страница канала */
.chpage { display: grid; gap: 10px; }
.banner { height: 54px; border: 2.5px solid var(--line); border-radius: 12px; position: relative; overflow: hidden; }
.banner::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.35) 0 10px, transparent 10px 22px); }
.chhead { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 12px; align-items: center; margin-top: -30px; padding: 0 6px; position: relative; z-index: 1; }
.avatar { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; }
.avatar svg { width: 34px; height: 34px; }
.chhead h4 { margin: 24px 0 0; font: 700 18px var(--display); }
.chhead p { margin: 0; font-size: 12.5px; color: var(--ink-soft); }
.chmeta { display: flex; gap: 6px; flex-wrap: wrap; }
.chmeta span { font: 700 12px var(--display); border: 2px solid var(--line); border-radius: 999px; padding: 2px 9px; background: var(--bg); }
.chmeta span.on { background: #d9f5ea; }
.chmeta span.bad { background: #ffd3cf; }
.vlist { display: grid; gap: 8px; }
.vid { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; align-items: start; }
.thumb { position: relative; width: 104px; aspect-ratio: 16 / 9; max-width: 100%; border: 2.5px solid var(--line); border-radius: 10px; display: grid; place-items: center; overflow: hidden; }
.thumb svg { width: 26px; height: 26px; }
.thumb small { position: absolute; right: 3px; bottom: 3px; font: 700 10px var(--body); background: rgba(31,35,56,.85); color: #fff; border-radius: 4px; padding: 0 4px; }
.vid b { font: 700 14px/1.25 var(--display); display: block; overflow-wrap: anywhere; }
.vid .vm { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.vbadges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.vbadges span { font: 700 10.5px var(--display); border-radius: 6px; padding: 0 6px; border: 1.5px solid var(--line); }
.vbadges .nomon { background: #ffd3cf; } .vbadges .cut { background: var(--muted); } .vbadges .viral { background: var(--sun); } .vbadges .collab { background: #e4dfff; } .vbadges .trend { background: #d9f5ea; }
.more { font: 700 14px var(--display); padding: 8px; border: 2.5px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; }
.note { font-size: 12.5px; color: var(--ink-soft); margin: 0; }

/* Комментарии */
.cm { border: 2.5px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 6px; }
.cm-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cm-ava { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font: 800 13px var(--display); flex: none; }
.cm-head b { font: 700 13.5px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kind { font: 700 10.5px var(--display); border-radius: 6px; padding: 0 6px; border: 1.5px solid var(--line); margin-left: auto; white-space: nowrap; }
.kind.pos { background: #d9f5ea; } .kind.q { background: #dff1ff; } .kind.hate { background: #ffd3cf; }
.cm p { margin: 0; }
.cm small { color: var(--ink-soft); font-size: 12px; overflow-wrap: anywhere; }
.cm .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.rbtn { font: 700 13px var(--display); padding: 7px 4px; border: 2px solid var(--line); border-radius: 9px; cursor: pointer; background: var(--card); box-shadow: 0 2px 0 var(--line); }
.rbtn.pos { background: #d9f5ea; } .rbtn.neg { background: #ffd3cf; }
.rbtn:active { transform: translateY(2px); box-shadow: none; }

/* Новости */
.feed { padding: 12px 14px; display: grid; gap: 4px; }
.feed p { margin: 0; font-size: 13.5px; overflow-wrap: anywhere; }
.feed p b { font-family: var(--display); }
.feed p.viral b { background: var(--sun); padding: 0 5px; border-radius: 5px; }
.feed p.ms b { color: var(--grape); }
.feed p.bad { color: #c4453a; }

/* Окна */
.overlay { position: fixed; inset: 0; background: rgba(31, 35, 56, .6); display: grid; place-items: center; z-index: 20; overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { max-width: 440px; width: 100%; padding: 22px; display: grid; gap: 12px; }
.modal h2 { margin: 0; font: 800 26px var(--display); text-wrap: balance; }
.modal p { margin: 0; color: var(--ink-soft); }
.modal .row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: 800 15px var(--display); padding: 10px 16px; border: 2.5px solid var(--line); border-radius: 11px; cursor: pointer; background: var(--card); box-shadow: 0 3px 0 var(--line); }
.btn.primary { background: var(--rec); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.menu-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 2px solid var(--muted); font-weight: 700; }
.seg { display: flex; border: 2.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { font: 700 13px var(--display); padding: 6px 12px; border: 0; background: var(--card); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.linkbtn { background: none; border: 0; padding: 6px 0; font: 700 14px var(--body); text-decoration: underline; cursor: pointer; text-align: left; }
.linkbtn.danger { color: #c4453a; }

/* Событие на весь экран */
.evmodal { max-width: 520px; width: 100%; padding: 0; overflow: hidden; animation: pop .35s ease-out; }
@keyframes pop { from { transform: translateY(14px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.evtop { padding: 22px 22px 16px; display: grid; justify-items: center; gap: 10px; text-align: center; border-bottom: 3px solid var(--line); }
.evtop .eico { width: 72px; height: 72px; border-radius: 20px; border: 3px solid var(--line); display: grid; place-items: center; background: #fff; }
.evtop .eico svg { width: 42px; height: 42px; }
.evtop h2 { margin: 0; font: 800 24px var(--display); text-wrap: balance; }
.evtop p { margin: 0; color: var(--ink); max-width: 42ch; }
.evopts { padding: 16px 18px 6px; display: grid; gap: 8px; }
.opt { text-align: left; padding: 11px 14px; border: 2.5px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; box-shadow: 0 3px 0 var(--line); display: grid; gap: 2px; }
.opt b { font: 700 16px var(--display); }
.opt span { font-size: 13px; color: var(--ink-soft); }
.opt:hover:not(:disabled) { background: #fffbe8; }
.opt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt:disabled { opacity: .45; cursor: not-allowed; }
.evfoot { padding: 4px 18px 16px; text-align: center; font-size: 12px; color: var(--ink-soft); font-weight: 700; display: grid; gap: 6px; justify-items: center; }
.evlock { width: 160px; height: 6px; border-radius: 3px; background: var(--muted); overflow: hidden; }
.evlock div { height: 100%; background: var(--grape); width: 0; }

/* Все видео */
.vbig { max-width: 860px; width: 100%; padding: 18px; display: grid; gap: 12px; max-height: calc(100vh - 32px); overflow: hidden; grid-template-rows: auto auto minmax(0, 1fr) auto; }
.vbig h2 { margin: 0; font: 800 24px var(--display); }
.vscroll { overflow-y: auto; display: grid; gap: 10px; align-content: start; padding-right: 4px; }
.vcard { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; border: 2.5px solid var(--line); border-radius: 12px; padding: 10px; }
.vcard .thumb { width: 150px; }
.vcard b { font: 700 15px/1.25 var(--display); }
.vstats { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-top: 8px; }
.vstats div { background: var(--bg); border: 2px solid var(--line); border-radius: 8px; padding: 3px 7px; min-width: 0; }
.vstats span { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); }
.vstats strong { font: 700 14px var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.vstats .hot strong { color: #c4453a; }
@media (max-width: 560px) { .vcard { grid-template-columns: minmax(0, 1fr); } .vcard .thumb { width: 100%; } }

/* Переезд */
.move { max-width: 420px; width: 100%; padding: 22px; display: grid; gap: 14px; text-align: center; overflow: hidden; }
.move h2 { margin: 0; font: 800 26px var(--display); }
.move p { margin: 0; color: var(--ink-soft); font-weight: 700; }
.road { position: relative; height: 70px; border-bottom: 3px solid var(--line); overflow: hidden; }
.road::after { content: ""; position: absolute; left: 0; right: 0; bottom: 8px; height: 3px; background: repeating-linear-gradient(90deg, var(--ink) 0 18px, transparent 18px 34px); animation: roadmove .5s linear infinite; }
@keyframes roadmove { to { background-position: -34px 0; } }
.truck { position: absolute; bottom: 12px; left: -90px; animation: drive 3.2s ease-in-out forwards; }
.truck svg { width: 92px; height: 52px; display: block; }
@keyframes drive { 0% { left: -100px; } 100% { left: calc(100% + 10px); } }
.move .bar { --c: var(--mint); }

/* Выбор темы */
.picker { max-width: 980px; width: 100%; padding: 22px; display: grid; gap: 14px; }
.picker h2 { margin: 0; font: 800 30px var(--display); }
.picker > p { margin: 0; color: var(--ink-soft); max-width: 64ch; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.tcard { text-align: left; padding: 12px; border: 2.5px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; display: grid; gap: 6px; align-content: start; }
.tcard .ti { width: 44px; height: 44px; border-radius: 12px; border: 2.5px solid var(--line); display: grid; place-items: center; }
.tcard .ti svg { width: 28px; height: 28px; }
.tcard b { font: 700 16px var(--display); }
.tcard span { font-size: 12.5px; color: var(--ink-soft); }
.tcard span em { font-style: normal; font-weight: 800; color: var(--ink); }
.tcard[aria-pressed="true"] { background: #fff0c2; box-shadow: 0 4px 0 var(--line); transform: translateY(-2px); }
.tcard:disabled { opacity: .4; cursor: not-allowed; }
.picker .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.namein { font: 700 20px var(--display); padding: 12px 14px; border: 3px solid var(--line); border-radius: 12px; width: 100%; background: var(--card); color: var(--ink); }
.namein:focus { outline: 3px solid var(--grape); outline-offset: 2px; }
.sugg { display: flex; gap: 6px; flex-wrap: wrap; }
.sugg button { font: 700 13px var(--display); border: 2px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--bg); cursor: pointer; }
.sgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .sgrid { grid-template-columns: minmax(0, 1fr); } }
.scard { border: 2.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); cursor: pointer; padding: 0; text-align: left; display: grid; }
.scard .sb { height: 52px; border-bottom: 2.5px solid var(--line); }
.scard .sh { display: flex; gap: 8px; align-items: center; padding: 8px 10px; font: 700 14px var(--display); min-width: 0; }
.scard .sh span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scard .av { width: 34px; height: 34px; border-radius: 50%; border: 2.5px solid var(--line); display: grid; place-items: center; flex: none; margin-top: -24px; }
.scard .av svg { width: 20px; height: 20px; }
.scard[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--sun), 0 4px 0 var(--line); }

/* Обучение */
.tip { position: fixed; z-index: 15; max-width: min(320px, calc(100vw - 32px)); padding: 12px 14px; display: grid; gap: 8px; background: var(--ink); color: #fff; border-radius: 14px; border: 3px solid var(--sun); box-shadow: 0 5px 0 rgba(31,35,56,.35); font-weight: 700; animation: pop .3s ease-out; }
.tip .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.tip button { font: 700 13px var(--display); border-radius: 8px; padding: 5px 10px; cursor: pointer; border: 2px solid var(--sun); background: var(--sun); color: var(--ink); }
.tip button.skip { background: transparent; color: #c9cde0; border-color: transparent; text-decoration: underline; padding: 5px 0; }
.pulse { animation: pulse 1.2s ease-in-out infinite; position: relative; z-index: 1; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,194,61,.9), 0 4px 0 var(--line); } 50% { box-shadow: 0 0 0 8px rgba(255,194,61,0), 0 4px 0 var(--line); } }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; font: 700 15px var(--display); padding: 10px 18px; border-radius: 999px; z-index: 30; border: 3px solid var(--sun); max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { .floater, .evmodal, .tip { animation-duration: .01s; } .pulse { animation: none; outline: 3px solid var(--sun); } .bar > div { transition: none; } }
</style>
